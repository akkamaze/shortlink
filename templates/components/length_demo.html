<div class="length-demo" style="--len-long: {{ demo.long_len }}; --len-random: {{ demo.random_len }}; --len-custom: {{ demo.custom_len }}">
  <p class="length-demo__long"><span class="length-demo__long-text">{{ demo.long_url }}</span></p>

  <p class="length-demo__short">
    <span class="length-demo__host">{{ demo.host }}</span>
    {%- for c in demo.random_slug -%}
      <i class="length-demo__out" style="animation-delay: {{ c.delay_ms }}ms">{{ c.ch }}</i>
    {%- endfor -%}
    {%- for c in demo.custom_slug -%}
      <i class="length-demo__in" style="animation-delay: {{ c.delay_ms }}ms">{{ c.ch }}</i>
    {%- endfor -%}
    <span class="length-demo__caret-window"><span class="length-demo__caret"></span></span>
  </p>

  <p class="length-demo__meta">
    <span class="length-demo__count"></span> characters, down from {{ demo.long_len }}
    <span class="length-demo__saving">
      <span class="length-demo__saving-random">· {{ demo.random_saving }}% shorter</span>
      <span class="length-demo__saving-custom">· {{ demo.custom_saving }}% shorter</span>
    </span>
  </p>
</div>
