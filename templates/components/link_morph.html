<div class="morph-card">
  <div class="morph-card__stage">
    {% for demo in demos %}
      <div class="morph-card__slot">
        <div class="morph-card__caption morph-card__caption--long" style="animation-delay: {{ demo.delay_ms }}ms">{{ demo.long_caption }}</div>
        <div class="morph-card__caption morph-card__caption--short" style="animation-delay: {{ demo.delay_ms }}ms">{{ demo.short_caption }}</div>

        <div class="morph-card__long" style="animation-delay: {{ demo.delay_ms }}ms">
          {%- for c in demo.long_chars -%}
            <i style="animation-delay: {{ c.delay_ms }}ms">{{ c.ch }}</i>
          {%- endfor -%}
        </div>

        <div class="morph-card__short" style="animation-delay: {{ demo.delay_ms }}ms">
          {%- for c in demo.short_chars -%}
            <i {% if c.dim %}class="is-dim" {% endif %}style="animation-delay: {{ c.delay_ms }}ms">{{ c.ch }}</i>
          {%- endfor -%}
        </div>
      </div>
    {% endfor %}
  </div>

  <span class="morph-card__copied">Copied</span>
</div>
